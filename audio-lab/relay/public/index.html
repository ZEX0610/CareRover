<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareRover Audio Lab · 家长通话原型</title><link rel="stylesheet" href="/style.css">
<main><h1>CareRover Audio Lab</h1>
<p>独立音频原型，不是现有小车控制页。需经 HTTPS 或本机 localhost 打开，获得浏览器麦克风权限。</p>
<label>家长端口令 <input id="token" type="password" autocomplete="off" placeholder="AUDIO_PARENT_TOKEN"></label>
<div><button id="connect">连接并允许麦克风</button><button id="disconnect" disabled>结束通话</button></div>
<button id="talk" disabled>按住说话（松开即停止上行）</button>
<p id="state" role="status">未连接。小车需在串口主动输入 remote 才会开启其麦克风。</p>
</main><script type="module" src="/client.js"></script>
</html>
