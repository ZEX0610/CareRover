name: Console checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python -m pip install -r mock/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

      - run: c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/main_wireless tests/firmware/safety_test.cpp -o /tmp/carerover-safety-test
      - run: /tmp/carerover-safety-test
      - run: python tools/check_firmware.py
      - run: python tools/verify_demo_handoff.py 'CareRover_Demo_Signal_Optimization_Handoff_2026-09-15_clean(1)'
      - run: python tools/replay_demo.py 'CareRover_Demo_Signal_Optimization_Handoff_2026-09-15_clean(1)/evidence' --output /tmp/carerover-demo-replay.json
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [3, 5]
        integration: [legacy, observe, manual, follow]
        tuning: [SAFE_BASELINE]
        include:
          - stage: 5
            integration: follow
            tuning: DEMO_BALANCED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/carerover.py build --profile config/tracking-development.json --stage ${{ matrix.stage }} --integration ${{ matrix.integration }} --tuning-profile ${{ matrix.tuning }}
