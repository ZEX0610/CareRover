    dependencies:
    - name: idf
      require: private
      version: '>=5.0'
    source:
      registry_url: https://components.espressif.com/
      type: service
    version: 0.7.0
  espressif/esp-dl:
    dependencies:
    - matches:
      - if: target in ["esp32", "esp32c2", "esp32c3", "esp32c6", "esp32p4", "esp32s2", "esp32s3"]
        version: '>=5.3'
      - if: target == esp32c5
