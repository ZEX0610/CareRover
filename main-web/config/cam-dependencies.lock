      - if: target == esp32s31
        version: '>=6.0'
      name: idf
    - name: espressif/esp_new_jpeg
      version: ^1
    - name: espressif/dl_fft
      version: '>=0.6.0'
    source:
      path: ${PROJECT_ROOT}/build/dependencies/esp-dl/esp-dl
      type: local
    targets:
    - esp32
    - esp32c2
    - esp32c3
    - esp32c5
    - esp32c6
    - esp32p4
    - esp32s2
    - esp32s3
