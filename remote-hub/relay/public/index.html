<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareRover · 家长通话</title><link rel="stylesheet" href="/style.css">
<main><h1>实时通话</h1>
<p>需经 HTTPS 打开。页面不保存录音；结束通话即关闭浏览器麦克风。按住说话、松开收听；家长端戴耳机可减少回声。</p>
<p>从已登录的远程控制台打开时，无需再次输入口令。点击连接并允许麦克风后即可收听。</p>
<label>家长端口令（已登录可留空）<input id="token" type="password" autocomplete="off" placeholder="可选：原有口令方式"></label>
<div><button id="connect">连接并允许麦克风</button><button id="disconnect" disabled>结束通话</button></div>
<button id="talk" disabled>按住说话（松开即停止上行）</button>
<p id="audioStats" aria-live="polite">已松开 · 麦克风采集 0 帧 · 已发送 0 帧</p>
<p id="state" role="status">未连接。请先确认车旁 Windows 网关在线。</p>
</main><script type="module" src="/client.js"></script>
</html>
