<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareRover · 家长通话</title><link rel="stylesheet" href="/style.css">
<main><h1>实时通话</h1>
<p>需经 HTTPS 打开。页面不录音；结束通话即关闭浏览器麦克风。</p>
<label>家长端口令 <input id="token" type="password" autocomplete="off" placeholder="AUDIO_PARENT_TOKEN"></label>
<div><button id="connect">连接并允许麦克风</button><button id="disconnect" disabled>结束通话</button></div>
<button id="talk" disabled>按住说话（松开即停止上行）</button>
<p id="state" role="status">未连接。当前小车完整固件尚未集成音频链路。</p>
</main><script type="module" src="/client.js"></script>
</html>
