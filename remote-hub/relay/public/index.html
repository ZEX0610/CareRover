<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191e">
<title>CareRover · 与孩子通话</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/css/remote.css">
</head>
<body class="call-standalone">
<main class="remote-call-dialog" id="remoteCallDialog" data-call-phase="idle" data-speaking="false" aria-labelledby="remoteCallTitle">
  <div class="remote-call-dialog__head">
    <div class="remote-call-dialog__identity"><span class="remote-call-dialog__avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.7 3H4.5C3.7 3 3 3.7 3 4.5 3 13.6 10.4 21 19.5 21c.8 0 1.5-.7 1.5-1.5v-2.2c0-.7-.5-1.3-1.1-1.5l-3.1-.8c-.5-.1-1 0-1.4.4l-1.3 1.3a14 14 0 0 1-6.8-6.8l1.3-1.3c.4-.4.5-.9.4-1.4l-.8-3.1C8 3.5 7.4 3 6.7 3Z"/></svg></span><div><h1 id="remoteCallTitle">与孩子通话</h1><p id="state" role="status">准备接通</p></div></div>
    <span class="remote-call-dialog__live" aria-hidden="true"><i></i>CareRover</span>
    <a class="remote-call-dialog__close" href="/" aria-label="返回控制台">×</a>
  </div>
  <div class="remote-call-dialog__layout">
    <div class="remote-call-dialog__video"><div class="standalone-call-art" aria-hidden="true"><span class="standalone-call-art__ring"></span><span class="standalone-call-art__mark">C</span></div></div>
    <div class="remote-call-dialog__body">
      <div class="remote-call-dialog__start"><button id="connect" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 3H4.5C3.7 3 3 3.7 3 4.5 3 13.6 10.4 21 19.5 21c.8 0 1.5-.7 1.5-1.5v-2.2c0-.7-.5-1.3-1.1-1.5l-3.1-.8c-.5-.1-1 0-1.4.4l-1.3 1.3a14 14 0 0 1-6.8-6.8l1.3-1.3c.4-.4.5-.9.4-1.4l-.8-3.1C8 3.5 7.4 3 6.7 3Z"/></svg><span>开始通话</span></button><p>接通后即可收听；按住说话，松开继续听。</p></div>
      <div class="remote-call-dialog__active"><div class="remote-call-dialog__controls"><button id="talk" type="button" disabled aria-label="按住说话，松开收听"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span>按住说话</span></button><button id="disconnect" type="button" disabled aria-label="挂断通话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 3H4.5C3.7 3 3 3.7 3 4.5 3 13.6 10.4 21 19.5 21c.8 0 1.5-.7 1.5-1.5v-2.2c0-.7-.5-1.3-1.1-1.5l-3.1-.8c-.5-.1-1 0-1.4.4l-1.3 1.3a14 14 0 0 1-6.8-6.8l1.3-1.3c.4-.4.5-.9.4-1.4l-.8-3.1C8 3.5 7.4 3 6.7 3Z"/></svg><span>挂断</span></button></div><p class="remote-call-dialog__hint">松开即恢复收听。戴耳机可减少回声。</p></div>
      <details class="remote-call-dialog__more"><summary>连接选项与通话详情</summary><label for="token">家长口令（已登录可留空）</label><input id="token" type="password" autocomplete="off" placeholder="已登录可留空"><p id="audioStats" aria-live="off">已松开 · 麦克风采集 0 帧 · 已发送 0 帧</p></details>
    </div>
  </div>
</main>
<script type="module" src="/client.js"></script>
</body>
</html>
